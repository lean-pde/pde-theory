name = "pde-theory"
defaultTargets = ["PDETheory"]

# Pinned to a mathlib release tag; the Lean toolchain in `lean-toolchain` must match
# this tag's version (currently v4.33.0). Bump both together, manually, when adopting
# a new mathlib release.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

[leanOptions]
pp.unicode.fun = true # pretty-print `fun a ↦ b`
autoImplicit = false

[[lean_lib]]
name = "PDETheory"
